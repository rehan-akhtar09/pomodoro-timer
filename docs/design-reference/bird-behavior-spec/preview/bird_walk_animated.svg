<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200">
<title>Pomodoro Bird — Walk Animation Preview</title>
<style>
.bird { animation: bob .65s ease-in-out infinite alternate; transform-origin: 118px 112px; }
.foot1 { animation: step1 .65s ease-in-out infinite alternate; transform-origin: 95px 150px; }
.foot2 { animation: step2 .65s ease-in-out infinite alternate; transform-origin: 138px 150px; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
@keyframes step1 { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
@keyframes step2 { from { transform: rotate(8deg); } to { transform: rotate(-8deg); } }
</style>
<g class="bird">
<ellipse cx="118" cy="112" rx="66" ry="52" fill="#A9BDA8"/>
<circle cx="166" cy="77" r="42" fill="#A9BDA8"/>
<path d="M197 80 L224 91 L197 102 Z" fill="#C9795C"/>
<ellipse cx="94" cy="118" rx="34" ry="27" fill="#91A991"/>
<circle cx="178" cy="68" r="6" fill="#2F3A35"/>
<path d="M82 86 Q104 66 128 88 Q105 107 82 86 Z" fill="#7F987F"/>
<path d="M83 87 Q106 93 127 88" fill="none" stroke="#6F826F" stroke-width="3"/>
</g>
<path class="foot1" d="M74 150 Q89 168 105 150" fill="none" stroke="#C9795C" stroke-width="7" stroke-linecap="round"/>
<path class="foot2" d="M122 151 Q138 168 154 148" fill="none" stroke="#C9795C" stroke-width="7" stroke-linecap="round"/>
</svg>