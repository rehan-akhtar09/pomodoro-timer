<style>
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        .timer-ring {
            stroke-dasharray: 880;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        
        .floating-leaf {
            animation: float 6s ease-in-out infinite;
        }
        
        .floating-leaf-2 {
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-between relative pb-[80px]">
<!-- Decorative Elements (Forest Accents) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0 opacity-40">
<svg class="absolute top-20 left-10 w-16 h-16 text-primary-container floating-leaf" fill="currentColor" viewbox="0 0 24 24">
<path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 7.05,10.67 9,12C9,12 17,8 17,8Z"></path>
</svg>
<svg class="absolute top-40 right-12 w-12 h-12 text-tertiary-container floating-leaf-2" fill="currentColor" viewbox="0 0 24 24">
<path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 7.05,10.67 9,12C9,12 17,8 17,8Z" style="transform: scaleX(-1); transform-origin: center;"></path>
</svg>
</div>
<!-- TopAppBar -->
<header class="flex justify-between items-center h-16 w-full px-margin-mobile bg-surface w-full top-0 z-10">
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:opacity-80 active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined font-headline-md text-headline-md" data-icon="music_note">music_note</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Pomodoro Bird</h1>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:opacity-80 active:scale-95 transition-transform text-primary">
<span class="material-symbols-outlined font-headline-md text-headline-md" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center w-full px-space-lg relative z-10 gap-space-xl max-w-md mx-auto">
<!-- Illustration Area -->
<div class="relative w-64 h-64 flex items-center justify-center">
<!-- Cozy 2D Illustration Placeholder -->
<div class="w-full h-full relative" data-alt="A cozy, soft 2D minimalist illustration of a small, cute bird sleeping peacefully on a wooden perch or small nest. The bird is round and soft. The background is a clean, warm cream color. The style is flat, organic, and vector-like, similar to high-quality mindful productivity apps. Warm, gentle lighting, cozy minimalism." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBi1WZ5oVk7-oLPc4tBPwSg1AtgDcZd0wIkMKvvYz6gccNruNr7VEh3O7T3rEXR211H9RSDBQy1Q6eLjKamFcF0-TI8rkaoPmnmiw42DJSj0TussIdDRDhaDN-sLFWyxLQZYabcGOBVHcOpSATdX1a9iiA3cfJpoMH5v9iJGDXeDw31pnfozCZ01iVlQdCgjcaG-bj3iWEONNXATAirjUD2bYNlx1wYZ8nNL_tcvkXKozEGmlkpMQo58A')">

<span class="material-symbols-outlined text-[100px] text-tertiary opacity-80" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<!-- Actual image element over it -->
<img class="absolute inset-0 w-full h-full object-contain z-10" data-alt="A cozy, soft 2D minimalist illustration of a small, cute bird sleeping peacefully on a wooden perch or small nest. The bird is round and soft. The background is a clean, warm cream color. The style is flat, organic, and vector-like, similar to high-quality mindful productivity apps. Warm, gentle lighting, cozy minimalism." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZLDJezgxkOrjoifwBi6StUf6wEsdOgr4FM9YgJc4i-IMznhfEnLM4x8zgeMxzuiiHf2wkxKuSdd-HDL6cgaVQ5Z5wZ1CiVZiQdAYdY9aCUGFrGS9HD8oSmY4uR0KaMjgYEEaqLqizeXtEDxG-ppu-6G1qJhELk7T68bugSZa9OXX7NgRycBCWdh3IHBuPpEBo1eQrnYXkG9surjouOyRgsVUd7ZnOKfNd7n5xD9rQ_QRZWAhkAqI6sg"/>
</div>
</div>
<!-- Timer Display Area -->
<div class="relative w-[280px] h-[280px] flex flex-col items-center justify-center">
<!-- Progress Ring Background -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 300 300">
<circle class="stroke-surface-variant" cx="150" cy="150" fill="none" r="140" stroke-width="12"></circle>
<!-- Active Progress Ring -->
<circle class="stroke-primary timer-ring" cx="150" cy="150" fill="none" r="140" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<div class="flex flex-col items-center z-10">
<span class="font-timer-display text-timer-display text-on-surface">25:00</span>
<span class="font-label-sm text-label-sm text-tertiary mt-2 uppercase tracking-widest">Focus Session</span>
</div>
</div>
<!-- Action Area -->
<div class="w-full flex justify-center mt-space-md">
<button class="bg-primary text-on-primary font-headline-md text-headline-md py-4 px-12 rounded-full shadow-[0_4px_12px_rgba(28,28,23,0.08)] hover:opacity-90 active:scale-95 transition-all duration-200">
                Start
            </button>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-safe bg-surface-container-low/80 backdrop-blur-md rounded-t-xl border-t border-outline-variant/20 shadow-sm h-[80px]">

<span class="material-symbols-outlined mb-1" data-icon="settings_heart">settings_heart</span>
