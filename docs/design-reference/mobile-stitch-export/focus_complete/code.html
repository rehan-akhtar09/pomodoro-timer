<style>
        .pulse-glow {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(139, 168, 136, 0.4)); }
            50% { filter: drop-shadow(0 0 16px rgba(139, 168, 136, 0.8)); }
        }
        .float-up {
            animation: float-up 4s ease-out forwards;
        }
        @keyframes float-up {
            0% { transform: translateY(20px); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Top Navigation (Suppressed for transactional focus complete screen, but minimal brand anchor kept) -->
<header class="absolute top-0 w-full px-margin-mobile h-16 flex justify-between items-center z-10 bg-surface">
<button aria-label="Music" class="text-primary hover:opacity-80 active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="music_note" data-weight="fill" style="font-variation-settings: 'FILL' 1;">music_note</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Pomodoro Bird</h1>
<button aria-label="Settings" class="text-primary hover:opacity-80 active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto px-margin-mobile flex flex-col items-center justify-center flex-grow z-10 space-y-space-xl">
<!-- Timer Display (Completed) -->
<div class="relative w-64 h-64 flex items-center justify-center rounded-full">
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="stroke-surface-variant" cx="50" cy="50" fill="none" r="44" stroke-width="12"></circle>
<circle class="stroke-primary-container" cx="50" cy="50" fill="none" r="44" stroke-dasharray="276" stroke-dashoffset="0" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<div class="text-center z-10">
<div class="font-timer-display text-timer-display text-primary">00:00</div>
</div>
<!-- Soft glowing particles behind bird -->
<div class="absolute -top-12 left-1/2 -translate-x-1/2 w-32 h-32 bg-primary-container/20 rounded-full blur-xl animate-pulse"></div>
<!-- Bird Illustration Container (Absolute positioned slightly above timer) -->
<div class="absolute -top-16 left-1/2 -translate-x-1/2 w-32 h-32 flex items-center justify-center pulse-glow z-20">
<!-- Using placeholder for cozy 2D illustration -->
<img class="w-full h-full object-contain drop-shadow-sm" data-alt="A cute, cozy 2D minimalist illustration of a happy little round bird holding a tiny glowing blue feather in its beak. The bird is styled in flat, soft shapes with gentle sage and cream tones, sitting on a subtle branch. Soft ambient light style, no harsh shadows. Focus Sanctuary aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2aJhheexIAbf2aQvZ3ITb_c-G6R3rir2lShpquPt3ogjtWRup16UfH6NReUsCjFT8_db8lgqzNk6BNTRWUTeUDTZhXrZBKXCMvhvPY05o-_xCLRi__pU8NAHoq7plGM62kiRVEVKuxCS3Ab6betVwzwodxX3LK3e1KT6UhHlgaS8xsE6MA-U95JdS5DTiwgm7u3EPIRMxXwlgSewen2GpJdvnoTvZ7xbEO3aNxT08s9Pa7q20D4trqg"/>
</div>
<!-- Environmental floating bits -->
<div class="absolute top-0 right-4 float-up text-primary-container opacity-0" style="animation-delay: 0.5s;">
<span class="material-symbols-outlined text-sm" data-icon="favorite" data-weight="fill" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="absolute top-4 left-0 float-up text-primary-container opacity-0" style="animation-delay: 1.2s;">
<span class="material-symbols-outlined text-xs" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- Completion Message -->
<div class="text-center space-y-space-sm mt-space-lg">
<h2 class="font-headline-lg text-headline-lg text-primary">Great job!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">You found a tiny blue feather.</p>
</div>
<!-- Call to Action -->
<div class="w-full mt-space-xl">
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg py-4 px-6 rounded-full shadow-sm hover:opacity-90 active:scale-98 transition-all duration-200 flex items-center justify-center gap-space-sm">
<span>Bring to Nest</span>
<span class="material-symbols-outlined" data-icon="nest_eco_friendly">downloading</span>
</button>
<button class="w-full mt-space-sm text-center font-label-sm text-label-sm text-on-surface-variant hover:text-primary py-3 transition-colors">
                Skip for now
            </button>
